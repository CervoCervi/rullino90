<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rullino 90</title>
<meta name="theme-color" content="#000080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rullino 90">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #008080; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: una sola "finestra" Windows 95 grigia, a tutta larghezza sul telefono, centrata e stretta su schermi grandi.
   Look deliberatamente unico (niente tema scuro): è un oggetto d'epoca. */
:root {
  --desk: #008080;      /* il verde acqua del desktop anni '90 */
  --win: #c0c0c0;       /* grigio finestra */
  --hi: #ffffff;        /* bordo luce */
  --lo: #808080;        /* bordo ombra */
  --ink: #000000;
  --title: #000080;     /* barra del titolo */
  --paper: #ffffff;
  --date: #e8742a;
  --ui: Tahoma, Verdana, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
html, body { min-height: 100%; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 13px/1.35 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 28px;
}
.finestra {
  max-width: 460px; margin: 0 auto; background: var(--win);
  border: 2px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi);
  box-shadow: inset -1px -1px 0 var(--lo), inset 1px 1px 0 #dfdfdf;
  padding: 3px;
}
.titolo {
  background: var(--title); color: var(--hi); font-weight: bold;
  padding: 3px 4px 3px 6px; display: flex; align-items: center; justify-content: space-between;
}
.titolo span:last-child {
  width: 16px; height: 14px; background: var(--win); color: var(--ink); font-size: 10px; line-height: 12px;
  text-align: center; border: 1px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi);
}
.corpo { padding: 10px 8px 8px; display: grid; gap: 10px; }
.incassato {
  background: var(--paper); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  box-shadow: inset 1px 1px 0 var(--ink);
}
.zona {
  display: grid; place-items: center; text-align: center; min-height: 110px; padding: 12px;
  cursor: pointer; user-select: none;
}
.zona.sopra { background: #ffffe1; }
.zona b { display: block; margin-bottom: 4px; }
.bottone {
  font: inherit; color: var(--ink); background: var(--win); padding: 5px 14px; min-height: 30px;
  border: 2px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi);
  box-shadow: inset -1px -1px 0 var(--lo); cursor: pointer;
}
.bottone:active:not(:disabled) { border-color: var(--ink) var(--hi) var(--hi) var(--ink); box-shadow: inset 1px 1px 0 var(--lo); }
.bottone:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
.bottone:focus-visible, .zona:focus-visible, input:focus-visible + span { outline: 1px dotted var(--ink); outline-offset: -5px; }
.bottone.primario { font-weight: bold; outline: 1px solid var(--ink); outline-offset: 0; }
fieldset {
  border: 2px groove var(--hi); margin: 0; padding: 6px 8px 8px;
  display: flex; flex-wrap: wrap; gap: 6px 14px;
}
legend { padding: 0 3px; }
label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; min-height: 28px; }
input[type=checkbox], input[type=radio] { accent-color: var(--title); width: 15px; height: 15px; margin: 0; }
.barra { height: 22px; padding: 2px; }
.barra div {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, var(--title) 0 9px, transparent 9px 11px);
}
.fondo { display: flex; gap: 8px; align-items: stretch; }
.stato {
  flex: 1; min-width: 0; padding: 4px 6px; background: var(--win); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); display: flex; align-items: center;
}
.provini { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 8px; align-items: start; }
.provini figure { margin: 0; display: grid; gap: 4px; }
.provini img { width: 100%; display: block; box-shadow: 1px 1px 0 var(--lo); }
.provini figcaption {
  font: 11px var(--mono); display: flex; justify-content: space-between; gap: 4px; align-items: center; min-width: 0;
}
.provini figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.provini .bottone { padding: 1px 8px; min-height: 24px; font-size: 11px; }
.nota { font-size: 11px; color: #303030; }
.esempio { font: 11px var(--mono); color: var(--lo); padding: 0 8px 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="finestra">
  <div class="titolo"><span>Rullino 90</span><span aria-hidden="true">×</span></div>
  <div class="corpo">
    <div id="zona" class="zona incassato" role="button" tabindex="0" aria-label="Scegli le foto">
      <div><b>Tocca per scegliere le foto</b><span id="zonaSub">dalla galleria del telefono</span></div>
    </div>
    <input id="scelta" type="file" accept="image/*" multiple hidden>

    <fieldset>
      <legend>Opzioni</legend>
      <label><input id="optData" type="checkbox" checked><span>Data</span></label>
      <label><input id="optLuce" type="checkbox" checked><span>Luce</span></label>
      <label><input id="optBordo" type="checkbox" checked><span>Bordo 10x15</span></label>
      <label><input id="optBn" type="checkbox"><span>Bianco e nero</span></label>
    </fieldset>

    <fieldset>
      <legend>Logo BRUT</legend>
      <label><input type="radio" name="logo" id="logoNo" value="nessuno" checked><span>Nessuno</span></label>
      <label><input type="radio" name="logo" id="logoBianco" value="bianco"><span>Bianco</span></label>
      <label><input type="radio" name="logo" id="logoNero" value="nero"><span>Nero</span></label>
    </fieldset>

    <div class="barra incassato"><div id="barra"></div></div>

    <div class="fondo">
      <div id="stato" class="stato">Pronto.</div>
      <button id="sviluppa" class="bottone primario" disabled>Sviluppa</button>
    </div>

    <div class="incassato">
      <div id="provini" class="provini"></div>
      <div id="esempio" class="esempio">Esempio: scegli le tue foto per sviluppare il rullino.</div>
    </div>

    <div class="fondo">
      <button id="salvaTutte" class="bottone" disabled>Salva tutte</button>
    </div>
    <div class="nota" id="nota">Le foto vengono sviluppate sul telefono e non vengono caricate da nessuna parte. "Salva" apre la condivisione: scegli Galleria, Foto o File.</div>
  </div>
</div>

const $ = id => document.getElementById(id);
let file = [];          // File scelti
let risultati = [];     // {nome, blob, url}
let alLavoro = false;

/* ---------- preferenze (solo comodità) ---------- */
function leggiPref() { try { return JSON.parse(localStorage.getItem("rullino90") || "{}"); } catch { return {}; } }
function scriviPref(p) { try { localStorage.setItem("rullino90", JSON.stringify(p)); } catch {} }
const pref = leggiPref();
if (pref.data === false) $("optData").checked = false;
if (pref.luce === false) $("optLuce").checked = false;
if (pref.bordo === false) $("optBordo").checked = false;
if (pref.bn === true) $("optBn").checked = true;
if (pref.logo) { const r = document.querySelector(`input[name=logo][value="${pref.logo}"]`); if (r) r.checked = true; }
function opzioni() {
  return {
    data: $("optData").checked, luce: $("optLuce").checked, bordo: $("optBordo").checked, bn: $("optBn").checked,
    logo: document.querySelector("input[name=logo]:checked").value,
  };
}
document.querySelectorAll("fieldset input").forEach(i => i.addEventListener("change", () => scriviPref(opzioni())));

/* ---------- utilità ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function semeDa(nome) { let s = 0; for (const c of new TextEncoder().encode(nome)) s += c; return s; }
function tela(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let logoImg = null;
function caricaLogo() {
  if (logoImg) return Promise.resolve(logoImg);
  return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(logoImg = i); i.onerror = ko; i.src = LOGO_SRC; });
}

/* ---------- sviluppo di una foto ---------- */
async function sviluppa(sorgente, nome, data, op) {
  // 1. dimensioni e ritaglio 3:2
  let sw = sorgente.width, sh = sorgente.height, sx = 0, sy = 0;
  if (op.bordo) {
    const r = sh > sw ? 2 / 3 : 3 / 2;
    if (sw / sh > r) { const nw = Math.round(sh * r); sx = (sw - nw) / 2; sw = nw; }
    else { const nh = Math.round(sw / r); sy = (sh - nh) / 2; sh = nh; }
  }
  const scala = Math.min(1, 2400 / Math.max(sw, sh));
  const w = Math.round(sw * scala), h = Math.round(sh * scala);

  // 2. un filo di morbidezza
  const c = tela(w, h), ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.filter = `blur(${(Math.max(w, h) / 3000).toFixed(2)}px)`;
  ctx.drawImage(sorgente, sx, sy, sw, sh, 0, 0, w, h);
  ctx.filter = "none";

  // 3. grana: rumore gaussiano leggermente sfocato
  const seme = semeDa(nome), rnd = mulberry32(seme);
  const cn = tela(w, h), cnx = cn.getContext("2d", { willReadFrequently: true });
  const nd = cnx.createImageData(w, h);
  for (let i = 0; i < w * h; i += 2) {
    const u = rnd() || 1e-9, v = rnd();
    const m = Math.sqrt(-2 * Math.log(u));
    const g1 = m * Math.cos(2 * Math.PI * v), g2 = m * Math.sin(2 * Math.PI * v);
    const a = clamp(g1 * 40 + 128, 0, 255), b = clamp(g2 * 40 + 128, 0, 255);
    nd.data.set([a, a, a, 255], i * 4);
    if (i + 1 < w * h) nd.data.set([b, b, b, 255], (i + 1) * 4);
  }
  cnx.putImageData(nd, 0, 0);
  const cb = tela(w, h), cbx = cb.getContext("2d", { willReadFrequently: true });
  cbx.filter = "blur(0.6px)"; cbx.drawImage(cn, 0, 0);
  const rumore = cbx.getImageData(0, 0, w, h).data;

  // 4. infiltrazione di luce: lato e posizione per ogni foto
  const rl = mulberry32(seme * 7 + 3);
  const lati = ["sinistra", "destra", "sopra", "sotto"];
  const lato = lati[Math.floor(rl() * 4)];
  const centro = 0.25 + rl() * 0.5, prof = 0.12 + rl() * 0.10, amp = 0.25 + rl() * 0.20;
  const forzaLuce = op.luce ? 0.6 : 0;

  // 5. un solo passaggio sui pixel: colore, luce, vignettatura, grana
  const img = ctx.getImageData(0, 0, w, h), p = img.data;
  const bn = !!op.bn;
  const calore = 1, vign = bn ? 0.45 : 0.35, grana = bn ? 0.7 : 0.5;
  // in bianco e nero la luce che entra vela la pellicola di grigio chiaro, non di rosso
  const [LR, LG, LB, NR, NG, NB] = bn ? [235, 235, 235, 255, 255, 255] : [255, 70, 30, 255, 170, 80];
  for (let y = 0; y < h; y++) {
    const fy = y / h;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, fx = x / w;
      let r = p[i] / 255, g = p[i + 1] / 255, b = p[i + 2] / 255;
      if (bn) {
        // pellicola in bianco e nero: luminanza, contrasto più deciso, carta appena calda
        let l = 0.3 * r + 0.59 * g + 0.11 * b;
        l = clamp(l - 0.06 * Math.sin(2 * Math.PI * l), 0, 1);
        l = 0.05 + l * 0.9;
        r = clamp(l + 0.012, 0, 1) * 255; g = l * 255; b = clamp(l - 0.015, 0, 1) * 255;
      } else {
      const med = (r + g + b) / 3;
      r = med + (r - med) * 0.82; g = med + (g - med) * 0.82; b = med + (b - med) * 0.82;
      r = clamp(r - 0.03 * Math.sin(2 * Math.PI * r), 0, 1);
      g = clamp(g - 0.03 * Math.sin(2 * Math.PI * g), 0, 1);
      b = clamp(b - 0.03 * Math.sin(2 * Math.PI * b), 0, 1);
      r = 0.06 + r * 0.9; g = 0.06 + g * 0.9; b = 0.06 + b * 0.9;
      r = r + 0.05 * calore;
      g = g + 0.015 * calore + 0.006 * (1 - g);
      b = b - 0.06 * calore + 0.012 * (1 - b);
      r = clamp(r, 0, 1) * 255; g = clamp(g, 0, 1) * 255; b = clamp(b, 0, 1) * 255;
      }

      if (forzaLuce > 0) {
        let dist, lungo;
        if (lato === "sinistra" || lato === "destra") { dist = lato === "sinistra" ? fx : 1 - fx; lungo = Math.abs(fy - centro); }
        else { dist = lato === "sopra" ? fy : 1 - fy; lungo = Math.abs(fx - centro); }
        const ms = Math.exp(-((dist / prof) ** 2)) * Math.exp(-((lungo / amp) ** 2));
        const nu = Math.exp(-((dist / (prof * 0.4)) ** 2)) * Math.exp(-((lungo / (amp * 0.4)) ** 2));
        const m = Math.min(ms * 0.7 * forzaLuce, 0.9), n = Math.min(nu * 0.5 * forzaLuce, 0.9);
        if (m > 0.002) {
          r = applica(r, m, LR); g = applica(g, m, LG); b = applica(b, m, LB);
          r = applica(r, n, NR); g = applica(g, n, NG); b = applica(b, n, NB);
        }
      }

      const dx = (fx - 0.5) * 2, dy = (fy - 0.5) * 2;
      const d = Math.sqrt(dx * dx + dy * dy);
      const vm = 1 - vign * Math.pow(Math.max(d - 0.55, 0), 1.5);
      r *= vm; g *= vm; b *= vm;

      const lum = (r + g + b) / 765, peso = 1 - (2 * lum - 1) ** 2;
      const n = (rumore[i] - 128) / 40 * 22 * grana * (0.4 + 0.6 * peso);
      p[i] = clamp(r + n, 0, 255); p[i + 1] = clamp(g + n, 0, 255); p[i + 2] = clamp(b + n, 0, 255);
    }
  }
  ctx.putImageData(img, 0, 0);

  // 6. logo e data
  if (op.logo !== "nessuno") await disegnaLogo(ctx, w, h, op.logo);
  if (op.data) stampaData(ctx, w, h, data);

  // 7. bordo bianco da stampa
  if (!op.bordo) return c;
  const mg = Math.round(Math.min(w, h) * 0.045);
  const cf = tela(w + 2 * mg, h + 2 * mg), cfx = cf.getContext("2d");
  cfx.fillStyle = "#f8f6f0"; cfx.fillRect(0, 0, cf.width, cf.height);
  cfx.drawImage(c, mg, mg);
  return cf;
}
function applica(base, peso, col) {
  const screen = 255 - (255 - base) * (1 - col / 255);
  const tinta = base * 0.3 + col * 0.7;
  return base * (1 - peso) + (screen * 0.5 + tinta * 0.5) * peso;
}

async function disegnaLogo(ctx, w, h, colore) {
  const l = await caricaLogo();
  const lw = Math.round(Math.min(w, h * 1.5) * 0.36), lh = Math.round(l.height * lw / l.width);
  const t = tela(lw, lh), tx = t.getContext("2d");
  tx.drawImage(l, 0, 0, lw, lh);
  tx.globalCompositeOperation = "source-in";
  tx.fillStyle = colore === "bianco" ? "#ffffff" : "#000000";
  tx.fillRect(0, 0, lw, lh);
  ctx.drawImage(t, Math.round((w - lw) / 2), Math.round((h - lh) / 2));
}

/* data arancione a 7 segmenti, formato  '26 11 3 */
const CIFRE = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg" };
function stampaData(ctx, w, h, data) {
  const s = Math.max(8, Math.floor(Math.min(w, h) * 0.022));
  const passo = Math.floor(s * 1.45), spazio = Math.floor(s * 0.9), t = Math.max(2, Math.floor(s / 4));
  const testo = "'" + String(data.getFullYear() % 100).padStart(2, "0") + " " + (data.getMonth() + 1) + " " + data.getDate();
  let larg = 0;
  for (const ch of testo) larg += ch === " " ? spazio : ch === "'" ? Math.floor(s / 2) : passo;
  const x0 = Math.floor(w - larg - w * 0.045), y0 = Math.floor(h - 2 * s - h * 0.05);

  const lv = tela(w, h), lx = lv.getContext("2d");
  lx.fillStyle = "rgba(255,140,40,0.92)";
  const rett = (a, b, c, d) => lx.fillRect(a, b, c - a, d - b);
  let x = x0;
  for (const ch of testo) {
    if (ch === " ") { x += spazio; continue; }
    if (ch === "'") { rett(x, y0, x + t, y0 + Math.floor(s / 2)); x += Math.floor(s / 2); continue; }
    const y = y0, h2 = Math.floor(t / 2);
    const seg = {
      a: [x + t, y, x + s - t, y + t], g: [x + t, y + s - h2, x + s - t, y + s + h2],
      d: [x + t, y + 2 * s - t, x + s - t, y + 2 * s], f: [x, y + t, x + t, y + s - h2],
      b: [x + s - t, y + t, x + s, y + s - h2], e: [x, y + s + h2, x + t, y + 2 * s - t],
      c: [x + s - t, y + s + h2, x + s, y + 2 * s - t],
    };
    for (const k of CIFRE[ch]) rett(...seg[k]);
    x += passo;
  }
  ctx.filter = `blur(${(s * 0.35).toFixed(1)}px)`; ctx.drawImage(lv, 0, 0);
  ctx.filter = `blur(${Math.max(0.3, s * 0.06).toFixed(1)}px)`; ctx.drawImage(lv, 0, 0);
  ctx.filter = "none";
}

/* ---------- interfaccia ---------- */
function stato(t) { $("stato").textContent = t; }
function barra(f) { $("barra").style.width = (clamp(f, 0, 1) * 100).toFixed(1) + "%"; }
function aggiornaBottoni() {
  $("sviluppa").disabled = alLavoro || file.length === 0;
  $("salvaTutte").disabled = alLavoro || risultati.length === 0;
}

function scegliFile(lista) {
  if (alLavoro) return;
  file = [...lista].filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if (!file.length) { stato("Nessuna foto tra i file scelti."); return; }
  $("zona").querySelector("b").textContent = `${file.length} foto pronte`;
  $("zonaSub").textContent = "tocca per cambiare scelta";
  stato("Pronto. Premi Sviluppa."); barra(0);
  aggiornaBottoni();
}

$("zona").addEventListener("click", () => $("scelta").click());
$("zona").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("scelta").click(); } });
$("scelta").addEventListener("change", e => scegliFile(e.target.files));
["dragenter", "dragover"].forEach(t => $("zona").addEventListener(t, e => { e.preventDefault(); $("zona").classList.add("sopra"); }));
["dragleave", "drop"].forEach(t => $("zona").addEventListener(t, e => { e.preventDefault(); $("zona").classList.remove("sopra"); }));
$("zona").addEventListener("drop", e => scegliFile(e.dataTransfer.files));

/* legge DateTimeOriginal (o DateTime) dai dati EXIF di un JPEG */
async function dataDi(f) {
  try {
    const v = new DataView(await f.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) === 0xFFD8) {
      let o = 2;
      while (o + 4 < v.byteLength) {
        const marker = v.getUint16(o), lung = v.getUint16(o + 2);
        if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          const d = leggiExif(v, o + 10);
          if (d) return d;
          break;
        }
        if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) break;
        o += 2 + lung;
      }
    }
  } catch {}
  return new Date(f.lastModified || Date.now());
}
function leggiExif(v, t) {
  const le = v.getUint16(t) === 0x4949;
  const u16 = o => v.getUint16(t + o, le), u32 = o => v.getUint32(t + o, le);
  const testo = (o, n) => { let s = ""; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(t + o + i)); return s; };
  const voci = ifd => { const n = u16(ifd), m = {}; for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; m[u16(e)] = e; } return m; };
  const ifd0 = voci(u32(4));
  let valore = null;
  if (ifd0[0x8769]) {
    const ex = voci(u32(ifd0[0x8769] + 8));
    if (ex[0x9003]) valore = testo(u32(ex[0x9003] + 8), u32(ex[0x9003] + 4));
  }
  if (!valore && ifd0[0x0132]) valore = testo(u32(ifd0[0x0132] + 8), u32(ifd0[0x0132] + 4));
  const m = valore && valore.match(/^(\d{4}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}

function pulisciRisultati() {
  risultati.forEach(r => URL.revokeObjectURL(r.url));
  risultati = []; $("provini").textContent = ""; $("esempio").hidden = true;
}

function aggiungiProvino(r, esempio) {
  const fig = document.createElement("figure");
  const im = document.createElement("img"); im.src = r.url; im.alt = r.nome;
  const cap = document.createElement("figcaption");
  const sp = document.createElement("span"); sp.textContent = r.nome;
  cap.append(sp);
  if (!esempio) {
    const b = document.createElement("button"); b.className = "bottone"; b.textContent = "Salva";
    b.addEventListener("click", () => salva(r.nome));
    cap.append(b);
  }
  fig.append(im, cap); $("provini").append(fig);
}

$("sviluppa").addEventListener("click", async () => {
  if (alLavoro || !file.length) return;
  alLavoro = true; aggiornaBottoni(); pulisciRisultati();
  const op = opzioni(); scriviPref(op);
  let ok = 0;
  for (let i = 0; i < file.length; i++) {
    const f = file[i];
    stato(`Sviluppo foto ${i + 1} di ${file.length}...`); barra(i / file.length);
    await new Promise(r => setTimeout(r, 30));
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: "from-image" });
      const data = await dataDi(f);
      const c = await sviluppa(bmp, f.name, data, op);
      bmp.close && bmp.close();
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
      const nome = f.name.replace(/\.[^.]+$/, "") + "_90s.jpg";
      const r = { nome, blob, url: URL.createObjectURL(blob) };
      risultati.push(r); aggiungiProvino(r); ok++;
    } catch (e) {
      console.error(e);
    }
  }
  barra(1);
  const persi = file.length - ok;
  stato(persi ? `Fatto. ${ok} stampe, ${persi} non riuscite.` : `Fatto. ${ok} stampe.`);
  alLavoro = false; aggiornaBottoni();
});

function comeFile(r) { return new File([r.blob], r.nome, { type: "image/jpeg" }); }

async function condividi(files) {
  if (!(navigator.canShare && navigator.canShare({ files }))) return false;
  try {
    await navigator.share({ files });
    stato(files.length > 1 ? `Condivise ${files.length} foto.` : "Condivisa: " + files[0].name);
  } catch (e) {
    stato(e && e.name === "AbortError" ? "Annullato." : "Condivisione non riuscita.");
  }
  return true;
}

function scarica(r) {
  const a = document.createElement("a");
  a.href = r.url; a.download = r.nome;
  document.body.append(a); a.click(); a.remove();
}

async function salva(nome) {
  const r = risultati.find(x => x.nome === nome);
  if (!r) return;
  if (await condividi([comeFile(r)])) return;
  scarica(r); stato("Scaricata: " + r.nome);
}

$("salvaTutte").addEventListener("click", async () => {
  if (!risultati.length) return;
  if (await condividi(risultati.map(comeFile))) return;
  for (const r of risultati) { scarica(r); await new Promise(ok => setTimeout(ok, 400)); }
  stato(`Scaricate ${risultati.length} foto.`);
});

/* ---------- esempio iniziale ---------- */
async function esempio() {
  const w = 1200, h = 900, c = tela(w, h), x = c.getContext("2d");
  const gr = x.createLinearGradient(0, 0, 0, h * 0.6);
  gr.addColorStop(0, "#5a96e6"); gr.addColorStop(1, "#96c8d2");
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  x.fillStyle = "#468240"; x.fillRect(0, h * 0.6, w, h * 0.4);
  x.fillStyle = "#fadc78"; x.beginPath(); x.arc(w * 0.65, h * 0.33, 95, 0, 7); x.fill();
  x.fillStyle = "#c83c32"; x.fillRect(w * 0.2, h * 0.45, w * 0.15, h * 0.4);
  const out = await sviluppa(c, "esempio.jpg", new Date(1998, 6, 14), { data: true, luce: true, bordo: true, logo: "nessuno" });
  const blob = await new Promise(r => out.toBlob(r, "image/jpeg", 0.85));
  if (risultati.length || alLavoro) return;
  const fig = { nome: "esempio_90s.jpg", blob, url: URL.createObjectURL(blob) };
  $("provini").textContent = ""; aggiungiProvino(fig, true);
}

esempio().catch(() => {});
aggiornaBottoni();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
